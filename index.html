<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>AI가 수행한 연구는 어떤 흔적을 남기는가</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">Mold Survey</span>
      <span class="lang-switch">
        <button type="button" class="lang-btn" data-lang="ko">한국어</button><button type="button" class="lang-btn" data-lang="en">English</button>
      </span>
    </div>
    <div class="progress"><div id="progress-fill"></div></div>
    <div id="progress-text" class="progress-text"></div>
  </header>

  <main>
    <noscript><p style="padding:2rem">This survey requires JavaScript. 이 설문은 자바스크립트가 필요합니다.</p></noscript>
    <div id="page" class="page"></div>
    <div class="navrow">
      <button type="button" id="btn-back" class="nav-btn secondary"></button>
      <span id="lock-note" class="lock-note"></span>
      <button type="button" id="btn-next" class="nav-btn primary"></button>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script>
    // localize static nav labels after boot
    window.addEventListener("DOMContentLoaded", function () {
      var back = document.getElementById("btn-back");
      var obs = new MutationObserver(function () {});
      function setLabels() {
        try {
          var L = window.I18N[document.documentElement.lang] || window.I18N.ko;
          back.textContent = L.nav_back;
        } catch (e) { }
      }
      setLabels();
      new MutationObserver(setLabels).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    });
  </script>
</body>
</html>
